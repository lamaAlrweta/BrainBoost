name = "hallha-ai"
compatibility_date = "2026-04-11"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "public"

[vars]
# Cloudflare Turnstile site key (public — safe to commit).
# This is the Cloudflare-documented "always passes" test key. Replace it with
# a real sitekey from dash.cloudflare.com/?to=/:account/turnstile once you
# create a widget. The matching TURNSTILE_SECRET_KEY is a Pages secret.
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"

# Cloudflare Account ID (public — safe to commit; appears in all dashboard URLs).
# Used by functions/api/contact.js to call the Cloudflare Email Sending REST
# API. Pages Functions can't use the native [[send_email]] binding (that's
# Workers-only), so we authenticate with a CLOUDFLARE_EMAIL_API_TOKEN
# secret instead — same Cloudflare Email Service, different transport.
CLOUDFLARE_ACCOUNT_ID = "aa501d55161bdae60ae4cca0b62a890f"
